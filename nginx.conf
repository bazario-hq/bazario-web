server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BZR-352: people kept getting the previous release after a deploy.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
