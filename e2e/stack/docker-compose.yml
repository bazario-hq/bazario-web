# Postgres for the Playwright suite. Start with `npm run e2e:db`.
services:
  postgres-e2e:
    image: postgres:17
    environment:
      POSTGRES_USER: bazario
      POSTGRES_PASSWORD: bazario
      POSTGRES_DB: postgres
    ports:
      - "55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazario"]
      interval: 2s
      timeout: 3s
      retries: 30
