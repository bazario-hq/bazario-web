name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_ref:
        description: bazario-api ref the E2E suite runs against
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_REF: ${{ inputs.api_ref || 'main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated API client matches openapi/openapi.json
        run: npm run api:check
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: bazario-web
      - uses: actions/checkout@v4
        with:
          repository: bazario-hq/bazario-api
          ref: ${{ env.API_REF }}
          path: bazario-api
      - uses: actions/setup-node@v4
        with:
          node-version-file: bazario-web/.nvmrc
          cache: npm
          cache-dependency-path: |
            bazario-web/package-lock.json
            bazario-api/package-lock.json
      - name: Install API dependencies (the E2E stack runs the real API)
        working-directory: bazario-api
        run: npm ci
      - name: Install web dependencies
        working-directory: bazario-web
        run: npm ci
      - name: Install Playwright browser
        working-directory: bazario-web
        run: npx playwright install --with-deps chromium
      - name: Start Postgres
        working-directory: bazario-web
        run: npm run e2e:db
      - name: Playwright
        working-directory: bazario-web
        env:
          API_DIR: ../bazario-api
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            bazario-web/playwright-report
            bazario-web/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          tags: bazario-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
